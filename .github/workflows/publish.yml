# Build and publish — rebuilds the site and uploads it to the host whenever main changes.
#
# Changes arrive from the website admin (/admin), which commits here, or from a push.
# The build runs the same checks as `npm run check`; if anything fails, nothing is
# uploaded and the site stays exactly as it was. Testimonials sent in through the
# website are emailed, never committed here (the repository is public).
#
# Set up once, in the repository's Settings › Secrets and variables › Actions:
#   Secrets    FTP_SERVER       the host name for the hosting package
#              FTP_USERNAME     its upload (FTP/SFTP) user — not the control-panel login
#              FTP_PASSWORD
#   Variables  DEPLOY_DIR       the folder on the server, ending in /  (e.g. public_html/)
#                               — publishing is skipped until this is set
#              SFTP_KNOWN_HOSTS the server's public SSH key, one line from
#                               `ssh-keyscan <host>`. The upload refuses any server whose
#                               key does not match, so the password only ever goes to the
#                               real host.
#              SITE_MODE        staging (default: noindex, sample testimonials shown with a
#                               label) or live (indexed; samples left out)
#
# The host accepts SFTP on port 22 only, so the upload uses lftp (from Ubuntu's own
# packages) rather than a third-party action: the password is handed to nothing outside
# GitHub's runner and Ubuntu. The upload adds and replaces files, and never deletes
# anything on the server, so files it did not put there (mail-config.php, the logs) are
# left alone. A page removed from the site stays on the server until deleted by hand.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        env:
          SITE_MODE: ${{ vars.SITE_MODE }}
        run: |
          node scripts/images.mjs
          if [ "$SITE_MODE" = "live" ]; then
            node scripts/build.mjs
          else
            node scripts/build.mjs --staging
          fi

      - name: Check
        run: npm run check

      - name: Install the SFTP client
        if: ${{ vars.DEPLOY_DIR != '' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to the host
        if: ${{ vars.DEPLOY_DIR != '' }}
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          KNOWN_HOSTS: ${{ vars.SFTP_KNOWN_HOSTS }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::Set the SFTP_KNOWN_HOSTS variable before publishing."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST:22" -e "
            set cmd:fail-exit yes;
            set net:timeout 30; set net:max-retries 2;
            set sftp:auto-confirm no;
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
            mirror --reverse --no-perms --parallel=4 --verbose ./dist/ '$DEPLOY_DIR';
            bye"
