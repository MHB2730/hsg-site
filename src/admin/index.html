<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Website admin — HSG Attorneys</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <!--
    The website admin: Sveltia CMS, reading admin/config.yml beside this file.
    Every save is a commit to the site's GitHub repository, after which the site
    rebuilds and uploads itself (.github/workflows/deploy.yml).
    The version is pinned so an update to the CMS can never change the admin
    unannounced; to upgrade, change the number here and check it still loads.
  -->
  <script src="https://unpkg.com/@sveltia/cms@0.219.0/dist/sveltia-cms.js"></script>
</body>
</html>
